name: ARM64 CI Image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - docker-compose.yaml
      - conan.lock
      - conanfile.txt
      - scripts/ci/cache_canary.py
      - scripts/ci/conan_cache_tunnel.sh
      - scripts/ci/orchestration.py
      - src/ros2_sdk/package.xml
      - src/ros2_sdk/CMakeLists.txt
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-arm64-main
  cancel-in-progress: false

env:
  CI_IMAGE: ghcr.io/200166shang/ros-sdk:ci-arm64-main
  CI_IMAGE_IMMUTABLE: ghcr.io/200166shang/ros-sdk:ci-arm64-run-${{ github.run_id }}-${{ github.run_attempt }}
  CANDIDATE_IMAGE: rosbridge:ci-arm64-candidate

jobs:
  classify:
    name: Classify image and cache inputs
    runs-on: ubuntu-latest
    outputs:
      image_changed: ${{ steps.classify.outputs.image_changed }}
    steps:
      - name: Check out main input history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the triggering inputs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          image_changed=true
          if [[ "$EVENT_NAME" == push ]]; then
            plan_arguments=()
            while IFS= read -r path; do
              plan_arguments+=(--changed-file "$path")
            done < <(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")
            plan=$(python3 -m scripts.ci plan \
              --event main-push \
              --cache-state hit \
              "${plan_arguments[@]}")
            image_changed=$(python3 -c \
              'import json, sys; print(str(json.load(sys.stdin)["publish_image"]).lower())' \
              <<< "$plan")
          fi
          echo "image_changed=$image_changed" >> "$GITHUB_OUTPUT"

  build-validate-publish:
    name: Build, validate, and publish ARM64 CI image
    needs: classify
    if: needs.classify.outputs.image_changed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=registry,ref=${{ env.CI_IMAGE }}
          cache-to: type=inline
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Start the candidate ROS 2 service
        env:
          ROSBRIDGE_IMAGE: ${{ env.CANDIDATE_IMAGE }}
        run: python3 -m scripts.ci compose-up

      - name: Run the repository CI workflow
        env:
          ROSBRIDGE_IMAGE: ${{ env.CANDIDATE_IMAGE }}
        run: ./rb ci

      - name: Upload colcon logs after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-logs
          path: log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the candidate ROS 2 service
        if: always()
        run: python3 -m scripts.ci compose-down

      - name: Publish the validated ci-arm64-main image
        run: python3 -m scripts.ci publish-image

  refresh-conan-cache:
    name: Refresh trusted Conan download cache
    needs:
      - classify
      - build-validate-publish
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.classify.result == 'success' &&
      (needs.build-validate-publish.result == 'success' ||
       needs.build-validate-publish.result == 'skipped')
    permissions:
      actions: write
      contents: read
      packages: read
    uses: ./.github/workflows/conan-cache-producer.yml
    with:
      checkout_ref: ${{ github.sha }}
      ci_image: >-
        ${{ needs.classify.outputs.image_changed == 'true' &&
        format('ghcr.io/200166shang/ros-sdk:ci-arm64-run-{0}-{1}', github.run_id,
        github.run_attempt) || 'ghcr.io/200166shang/ros-sdk:ci-arm64-main' }}
    secrets: inherit
