name: ARM64 CI Image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - docker-compose.yaml
      - conanfile.txt
      - conan.lock
      - src/ros2_sdk/package.xml
      - src/ros2_sdk/CMakeLists.txt
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-arm64-main
  cancel-in-progress: false

env:
  CI_IMAGE: ghcr.io/200166shang/ros-sdk:ci-arm64-main
  CANDIDATE_IMAGE: rosbridge:ci-arm64-candidate
  CONAN_REMOTE_NAME: rosbridge
  CONAN_REMOTE_URL: http://106.55.24.85:9300
  CONAN_LOGIN_USERNAME: ci-reader
  CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}

jobs:
  build-validate-publish:
    name: Build, validate, and publish ARM64 CI image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore main Conan package cache
        id: conan-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rosbridge-conan-p
          key: arm64-ubuntu-24.04-conan-2.31.2-gcc-13-cppstd-17-release-${{ hashFiles('docker/Dockerfile', 'conan.lock', 'conanfile.txt') }}

      - name: Configure Conan package cache mount
        env:
          CONAN_CACHE_PATH: ${{ runner.temp }}/rosbridge-conan-p
          CONAN_COMPOSE_OVERRIDE: ${{ runner.temp }}/rosbridge-conan-cache.override.yaml
          CONAN_CACHE_HIT: ${{ steps.conan-cache.outputs.cache-hit }}
          CONAN_CACHE_OUTCOME: ${{ steps.conan-cache.outcome }}
        run: |
          mkdir -p "$CONAN_CACHE_PATH"
          cat > "$CONAN_COMPOSE_OVERRIDE" <<EOF
          services:
            ros2:
              volumes:
                - $CONAN_CACHE_PATH:/root/.conan2/p
          EOF
          echo "COMPOSE_FILE=${GITHUB_WORKSPACE}/docker-compose.yaml:${CONAN_COMPOSE_OVERRIDE}" >> "$GITHUB_ENV"
          if [[ "$CONAN_CACHE_OUTCOME" != "success" ]]; then
            echo "Main Conan package cache: unavailable; continuing with Conan Server"
          elif [[ "$CONAN_CACHE_HIT" == "true" ]]; then
            echo "Main Conan package cache: hit"
          else
            echo "Main Conan package cache: miss; Conan install will populate it"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ci
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          cache-from: type=registry,ref=${{ env.CI_IMAGE }}
          cache-to: type=inline
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Start the candidate ROS 2 service
        env:
          ROSBRIDGE_IMAGE: ${{ env.CANDIDATE_IMAGE }}
        run: python3 -m scripts.ci compose-up

      - name: Run the repository CI workflow
        env:
          ROSBRIDGE_IMAGE: ${{ env.CANDIDATE_IMAGE }}
        run: ./rb ci

      - name: Upload colcon logs after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-image-logs
          path: log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the candidate ROS 2 service
        if: always()
        run: python3 -m scripts.ci compose-down

      - name: Publish the validated ci-arm64-main image
        run: python3 -m scripts.ci publish-image
