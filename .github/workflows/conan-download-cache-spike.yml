name: Conan Download Cache Spike

on:
  push:
    branches:
      - prototype/conan-download-cache

permissions:
  contents: read
  packages: read

concurrency:
  group: conan-download-cache-spike
  cancel-in-progress: false

env:
  CI_IMAGE: ghcr.io/200166shang/ros-sdk:ci-arm64-main
  COMPOSE_PROJECT_NAME: conan-download-cache-spike
  COMPOSE_SERVICE: ros2
  COMPOSE_NO_DEPS: "true"
  CONAN_REMOTE_NAME: rosbridge
  CONAN_DOWNLOAD_CACHE: /workspace/.cache/conan-download
  CONAN_BUILD_POLICY: never
  CONAN_REQUIRE_REMOTE: "true"
  CONAN_GRAPH_FILE: /workspace/.cache/conan-spike/install-graph.json
  CACHE_GENERATION: v1
  SAMPLE_ROLE: baseline
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  measure:
    name: Measure Conan download cache
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Record job start
        run: echo "SPIKE_JOB_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Check out the prototype
        uses: actions/checkout@v4

      - name: Create measurement directories
        run: mkdir -p .cache/conan-download .cache/conan-spike

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the existing CI image
        shell: bash
        run: |
          for attempt in 1 2; do
            if docker pull "$CI_IMAGE" >/dev/null; then
              echo "ROSBRIDGE_IMAGE=$CI_IMAGE" >> "$GITHUB_ENV"
              exit 0
            fi
            if [[ "$attempt" == "2" ]]; then
              echo "Unable to pull the existing ARM64 CI image" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Establish encrypted Conan tunnel
        env:
          CONAN_SSH_HOST: ${{ secrets.CONAN_SSH_HOST }}
          CONAN_SSH_USER: ${{ secrets.CONAN_SSH_USER }}
          CONAN_SSH_PRIVATE_KEY: ${{ secrets.CONAN_SSH_PRIVATE_KEY }}
          CONAN_SSH_KNOWN_HOSTS: ${{ secrets.CONAN_SSH_KNOWN_HOSTS }}
          CONAN_SSH_PORT: ${{ secrets.CONAN_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -u

          fail_tunnel_setup() {
            echo "SSH tunnel setup failed" >&2
            exit 1
          }

          host=${CONAN_SSH_HOST:-}
          user=${CONAN_SSH_USER:-}
          port=${CONAN_SSH_PORT:-}
          private_key=${CONAN_SSH_PRIVATE_KEY:-}
          known_hosts=${CONAN_SSH_KNOWN_HOSTS:-}

          if [[ -z "$host" || -z "$user" || -z "$port" || \
                -z "$private_key" || -z "$known_hosts" ]]; then
            fail_tunnel_setup
          fi
          if (( ${#host} > 253 )) || [[ "$host" == *..* ]]; then
            fail_tunnel_setup
          fi
          IFS='.' read -r -a host_labels <<< "$host"
          for label in "${host_labels[@]}"; do
            if [[ ! "$label" =~ ^([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]{0,61}[A-Za-z0-9])$ ]]; then
              fail_tunnel_setup
            fi
          done
          if [[ ! "$user" =~ ^[A-Za-z_][A-Za-z0-9._-]{0,31}$ ]]; then
            fail_tunnel_setup
          fi
          if [[ ! "$port" =~ ^[0-9]{1,5}$ ]]; then
            fail_tunnel_setup
          fi
          port=$((10#$port))
          if (( port < 1 || port > 65535 )); then
            fail_tunnel_setup
          fi

          state_dir="$RUNNER_TEMP/conan-ssh-tunnel"
          key_file="$state_dir/id_ci"
          known_hosts_file="$state_dir/known_hosts"
          control_socket="$state_dir/control"

          if ! install -d -m 700 "$state_dir" >/dev/null 2>&1; then
            fail_tunnel_setup
          fi
          if ! (umask 077; printf '%s\n' "$private_key" > "$key_file") 2>/dev/null; then
            fail_tunnel_setup
          fi
          if ! (umask 077; printf '%s\n' "$known_hosts" > "$known_hosts_file") 2>/dev/null; then
            fail_tunnel_setup
          fi
          unset private_key known_hosts CONAN_SSH_PRIVATE_KEY CONAN_SSH_KNOWN_HOSTS

          if ! ssh-keygen -y -P '' -f "$key_file" >/dev/null 2>&1; then
            fail_tunnel_setup
          fi
          known_host_token=$host
          if (( port != 22 )); then
            known_host_token="[$host]:$port"
          fi
          if ! ssh-keygen -F "$known_host_token" -f "$known_hosts_file" \
            >/dev/null 2>&1; then
            fail_tunnel_setup
          fi

          if ! ssh -M -S "$control_socket" -f -N \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ExitOnForwardFailure=yes \
            -o GatewayPorts=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$key_file" \
            -p "$port" \
            -l "$user" \
            -L 0.0.0.0:19300:127.0.0.1:9300 \
            "$host" >/dev/null 2>&1; then
            fail_tunnel_setup
          fi
          if [[ ! -S "$control_socket" ]] || \
            ! ssh -S "$control_socket" -O check -p "$port" -l "$user" "$host" \
              >/dev/null 2>&1; then
            fail_tunnel_setup
          fi
          echo "SSH tunnel established"

      - name: Start only the ROS 2 service
        env:
          CONAN_REMOTE_URL: http://host.docker.internal:19300
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
        run: python3 -m scripts.ci compose-up

      - name: Verify ARM64 build environment
        run: python3 -m scripts.ci verify-arm64

      - name: Calculate environment fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          cleanup_fingerprint_inputs() {
            if [[ -n "${fingerprint_input:-}" ]]; then
              rm -f "$fingerprint_input"
            fi
            if [[ -n "${image_digest_input:-}" ]]; then
              rm -f "$image_digest_input"
            fi
          }
          fingerprint_input=$(mktemp .cache/conan-spike/fingerprint-input.XXXXXX)
          trap cleanup_fingerprint_inputs EXIT
          image_digest_input=$(mktemp .cache/conan-spike/image-digests.XXXXXX)

          {
            printf 'conan-version:\n'
            docker exec ros2 conan --version
            printf 'gcc-version:\n'
            docker exec ros2 gcc --version
            printf 'effective-profile:\n'
            docker exec ros2 conan profile show -pr:h default \
              -s:h build_type=Release -s:h compiler.cppstd=17
          } >> "$fingerprint_input"

          docker image inspect "$ROSBRIDGE_IMAGE" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' > "$image_digest_input"
          if [[ ! -s "$image_digest_input" ]]; then
            echo "Pulled image has no immutable digest" >&2
            exit 1
          fi
          printf 'image-digests:\n' >> "$fingerprint_input"
          LC_ALL=C sort "$image_digest_input" >> "$fingerprint_input"

          for input in conanfile.txt conan.lock docker/Dockerfile; do
            if [[ -f "$input" ]]; then
              file_hash=$(sha256sum "$input")
              printf '%s=%s\n' "$input" "${file_hash%% *}" >> "$fingerprint_input"
            else
              printf '%s=absent\n' "$input" >> "$fingerprint_input"
            fi
          done

          fingerprint_hash=$(sha256sum "$fingerprint_input")
          fingerprint=${fingerprint_hash%% *}
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Environment fingerprint is invalid" >&2
            exit 1
          fi
          cleanup_fingerprint_inputs
          trap - EXIT
          echo "value=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Record cache restore start
        run: date +%s%3N > .cache/conan-spike/restore-start-ms

      - name: Restore Conan download cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/conan-download
          key: rosbridge-conan-download-${{ runner.arch }}-${{ steps.fingerprint.outputs.value }}-${{ env.CACHE_GENERATION }}

      - name: Measure cache restore
        id: restore-timing
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import time
          from pathlib import Path

          started = int(Path(".cache/conan-spike/restore-start-ms").read_text())
          seconds = (time.time_ns() // 1_000_000 - started) / 1000
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"seconds={seconds:.3f}\n")
          PY

      - name: Verify required Conan remote
        env:
          CONAN_REMOTE_URL: http://host.docker.internal:19300
        shell: bash
        run: |
          if verification_output=$(python3 -m scripts.ci verify-conan 2>&1); then
            printf '%s\n' "$verification_output"
          else
            echo "ARM64 dependency preparation required: Conan remote verification failed" >&2
            exit 1
          fi

      - name: Install dependencies and build
        id: build-timing
        shell: bash
        run: |
          started=$(date +%s%3N)
          set +e
          set -o pipefail
          ./rb build --clean 2>&1 | tee .cache/conan-spike/build.log >/dev/null
          status=${PIPESTATUS[0]}
          set -e
          ended=$(date +%s%3N)
          python3 - "$started" "$ended" <<'PY'
          import os
          import sys

          seconds = (int(sys.argv[2]) - int(sys.argv[1])) / 1000
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"seconds={seconds:.3f}\n")
          PY
          if [[ "$status" -ne 0 ]]; then
            if grep -Eq '^Conan install elapsed: [0-9]+\.[0-9]{3}s$' \
              .cache/conan-spike/build.log; then
              echo "Project build failed after Conan dependency preparation" >&2
            else
              echo "ARM64 dependency preparation required" >&2
            fi
          fi
          exit "$status"

      - name: Validate and collect sample
        run: |
          python3 -m scripts.ci.conan_cache_spike collect \
            --cache-dir .cache/conan-download \
            --graph-file .cache/conan-spike/install-graph.json \
            --build-log .cache/conan-spike/build.log \
            --build-total-seconds '${{ steps.build-timing.outputs.seconds }}' \
            --output .cache/conan-spike/collected.json

      - name: Record cache save start
        if: success() && steps.conan-cache.outputs.cache-hit != 'true'
        run: date +%s%3N > .cache/conan-spike/save-start-ms

      - name: Save Conan download cache
        if: success() && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/conan-download
          key: rosbridge-conan-download-${{ runner.arch }}-${{ steps.fingerprint.outputs.value }}-${{ env.CACHE_GENERATION }}

      - name: Measure cache save
        id: save-timing
        if: success() && steps.conan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import time
          from pathlib import Path

          started = int(Path(".cache/conan-spike/save-start-ms").read_text())
          seconds = (time.time_ns() // 1_000_000 - started) / 1000
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"seconds={seconds:.3f}\n")
          PY

      - name: Write result and job summary
        env:
          CACHE_HIT: ${{ steps.conan-cache.outputs.cache-hit == 'true' }}
          RESTORE_SECONDS: ${{ steps.restore-timing.outputs.seconds }}
          SAVE_SECONDS: ${{ steps.save-timing.outputs.seconds || '0' }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        shell: bash
        run: |
          ended=$(date +%s%3N)
          job_seconds=$(python3 - "$SPIKE_JOB_START_MS" "$ended" <<'PY'
          import sys

          print(f"{(int(sys.argv[2]) - int(sys.argv[1])) / 1000:.3f}")
          PY
          )
          python3 -m scripts.ci.conan_cache_spike report \
            --collected .cache/conan-spike/collected.json \
            --output .cache/conan-spike/result.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --role "$SAMPLE_ROLE" \
            --cache-hit "$CACHE_HIT" \
            --restore-seconds "$RESTORE_SECONDS" \
            --save-seconds "$SAVE_SECONDS" \
            --job-total-seconds "$job_seconds" \
            --generation "$CACHE_GENERATION" \
            --fingerprint "$FINGERPRINT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$GITHUB_SHA"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: conan-cache-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/conan-spike/result.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conan-cache-spike-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/conan-spike/build.log
            log/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Stop the ROS 2 service
        if: always()
        run: python3 -m scripts.ci compose-down

      - name: Close encrypted Conan tunnel
        if: always()
        env:
          CONAN_SSH_HOST: ${{ secrets.CONAN_SSH_HOST }}
          CONAN_SSH_USER: ${{ secrets.CONAN_SSH_USER }}
          CONAN_SSH_PORT: ${{ secrets.CONAN_SSH_PORT || '22' }}
        shell: bash
        run: |
          set +e
          state_dir="$RUNNER_TEMP/conan-ssh-tunnel"
          key_file="$state_dir/id_ci"
          known_hosts_file="$state_dir/known_hosts"
          control_socket="$state_dir/control"

          if [[ -S "$control_socket" && -n "${CONAN_SSH_HOST:-}" && \
                -n "${CONAN_SSH_USER:-}" && -n "${CONAN_SSH_PORT:-}" ]]; then
            ssh -S "$control_socket" -O exit \
              -p "$CONAN_SSH_PORT" \
              -l "$CONAN_SSH_USER" \
              "$CONAN_SSH_HOST" >/dev/null 2>&1 || true
          fi
          if command -v shred >/dev/null 2>&1; then
            shred -u "$key_file" "$known_hosts_file" >/dev/null 2>&1 || true
          fi
          rm -f "$key_file" "$known_hosts_file" "$control_socket" >/dev/null 2>&1 || true
          rmdir "$state_dir" >/dev/null 2>&1 || true
          exit 0
