name: Conan Access Smoke
run-name: Conan Access Smoke ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Correlation ID generated by the provisioning wizard
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conan-access-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: Verify restricted read-only Conan access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CI_IMAGE: >-
        ghcr.io/200166shang/ros-sdk@sha256:5ffd34eb18fe4421cc6abca49b0ee5ade007ca2b48cecb104fa2d17ecab9965d
      CONAN_SSH_PRIVATE_KEY: ${{ secrets.CONAN_SSH_PRIVATE_KEY }}
      CONAN_SSH_KNOWN_HOSTS: ${{ secrets.CONAN_SSH_KNOWN_HOSTS }}
      CONAN_SSH_HOST: ${{ secrets.CONAN_SSH_HOST }}
      CONAN_SSH_PORT: ${{ secrets.CONAN_SSH_PORT }}
      CONAN_SSH_USER: ${{ secrets.CONAN_SSH_USER }}
      CONAN_SSH_TARGET_HOST: ${{ secrets.CONAN_SSH_TARGET_HOST }}
      CONAN_SSH_TARGET_PORT: ${{ secrets.CONAN_SSH_TARGET_PORT }}
      CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify host, tunnel, Server, credentials, and package read
        run: scripts/ci/conan_access_smoke.sh
