name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Keep the CI image tag architecture-specific. The previous ci-main image
  # was built for the default x86_64 runner and must not be reused on ARM64.
  CI_IMAGE: ghcr.io/200166shang/ros-sdk:ci-arm64-main
  LOCAL_CI_IMAGE: rosbridge:pr-ci-arm64
  # The URL is public infrastructure metadata; credentials stay in Secrets.
  # The build helper keeps the remote optional and falls back when unavailable.
  CONAN_REMOTE_NAME: rosbridge
  CONAN_REMOTE_URL: http://106.55.24.85:9300
  CONAN_LOGIN_USERNAME: ci-reader
  CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}

jobs:
  changes:
    name: Detect environment changes
    runs-on: ubuntu-24.04-arm
    outputs:
      environment_changed: ${{ steps.detect.outputs.environment_changed }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect environment changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.ci detect-changes

  ci:
    name: Build, lint, and test
    needs: changes
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR for the reusable CI image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore main Conan package cache
        id: conan-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rosbridge-conan-p
          key: arm64-ubuntu-24.04-conan-2.31.2-gcc-13-cppstd-17-release-${{ hashFiles('docker/Dockerfile', 'conan.lock', 'conanfile.txt') }}

      - name: Configure Conan package cache mount
        env:
          CONAN_CACHE_PATH: ${{ runner.temp }}/rosbridge-conan-p
          CONAN_COMPOSE_OVERRIDE: ${{ runner.temp }}/rosbridge-conan-cache.override.yaml
          CONAN_CACHE_HIT: ${{ steps.conan-cache.outputs.cache-hit }}
          CONAN_CACHE_OUTCOME: ${{ steps.conan-cache.outcome }}
        run: |
          mkdir -p "$CONAN_CACHE_PATH"
          cat > "$CONAN_COMPOSE_OVERRIDE" <<EOF
          services:
            ros2:
              volumes:
                - $CONAN_CACHE_PATH:/root/.conan2/p
          EOF
          echo "COMPOSE_FILE=${GITHUB_WORKSPACE}/docker-compose.yaml:${CONAN_COMPOSE_OVERRIDE}" >> "$GITHUB_ENV"
          if [[ "$CONAN_CACHE_OUTCOME" != "success" ]]; then
            echo "Conan package cache: unavailable; continuing with Conan Server"
          elif [[ "$CONAN_CACHE_HIT" == "true" ]]; then
            echo "Conan package cache: hit"
          else
            echo "Conan package cache: miss"
          fi

      - name: Prepare CI image
        env:
          ENVIRONMENT_CHANGED: ${{ needs.changes.outputs.environment_changed }}
        run: python3 -m scripts.ci prepare-image

      - name: Start the ROS 2 service
        run: python3 -m scripts.ci compose-up

      - name: Verify ARM64 build environment
        run: python3 -m scripts.ci verify-arm64

      - name: Verify Conan remote
        run: python3 -m scripts.ci verify-conan

      - name: Run the repository CI workflow
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./rb ci

      - name: Upload colcon logs after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ci-logs
          path: log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the ROS 2 service
        if: always()
        run: python3 -m scripts.ci compose-down
