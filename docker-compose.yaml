# RosBridge Pro — development environment
#
# Services:
#   ros2   — main development container: ROS 2 Jazzy + build toolchain,
#            with the repository bind-mounted at /workspace.
#   novnc  — browser-based VNC viewer (http://localhost:6080) with the X server
#            used by Gazebo in the ros2 container.

services:
  ros2:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: ${ROSBRIDGE_IMAGE:-rosbridge:dev}
    container_name: ros2
    stdin_open: true
    tty: true
    # Keep the container alive for interactive development.
    command: tail -f /dev/null
    depends_on:
      - novnc
    environment:
      # Gazebo renders into the X server owned by the noVNC container.
      DISPLAY: "novnc:0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: "42"
      # Optional Conan remote configuration. Keep credentials outside the
      # repository; .env is ignored and .env.example documents the names.
      CONAN_REMOTE_NAME: ${CONAN_REMOTE_NAME:-rosbridge}
      CONAN_REMOTE_URL: ${CONAN_REMOTE_URL:-}
      CONAN_LOGIN_USERNAME: ${CONAN_LOGIN_USERNAME:-}
      CONAN_PASSWORD: ${CONAN_PASSWORD:-}
      # Opt-in CI experiment controls. Empty/default values preserve local behavior.
      CONAN_DOWNLOAD_CACHE: ${CONAN_DOWNLOAD_CACHE:-}
      CONAN_BUILD_POLICY: ${CONAN_BUILD_POLICY:-missing}
      CONAN_REQUIRE_REMOTE: ${CONAN_REQUIRE_REMOTE:-false}
      CONAN_GRAPH_FILE: ${CONAN_GRAPH_FILE:-}
    ports:
      - "8080:8080" # HTTP gateway
      - "9090:9090" # WebSocket
      - "8765:8765" # gRPC
    volumes:
      # Source tree: live-reloads on the host filesystem.
      - .:/workspace
      # Conan package cache — persists across container recreation so
      # dependencies (spdlog, gtest, ...) are not re-downloaded / rebuilt.
      - conan_cache:/root/.conan2
      # Shared memory for high-bandwidth intra-container communication
      # (e.g. Gazebo / ROS 2 image transport).
      - /dev/shm:/dev/shm

  novnc:
    image: theasp/novnc:latest
    container_name: novnc
    environment:
      # Give Gazebo enough horizontal room for its scene and inspector panes.
      # The browser URL uses scale=true to fit this desktop into smaller windows.
      DISPLAY_WIDTH: "1280"
      DISPLAY_HEIGHT: "800"
    ports:
      # theasp/novnc serves noVNC on port 8080 inside the container.
      - "6080:8080"

volumes:
  conan_cache:
    driver: local
